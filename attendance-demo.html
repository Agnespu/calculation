<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>假勤统计自动化工作流</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #09090b;
    --card: #18181b;
    --border: #27272a;
    --accent: #10b981;
    --warn: #f59e0b;
    --err: #ef4444;
    --text: #e4e4e7;
    --muted: #a1a1aa;
    --faint: #71717a;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .mono { font-family: var(--mono); }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 28px 20px 48px; }

  /* ===== header ===== */
  header { padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
  .demo-chip {
    font-size: 11px; color: var(--accent); border: 1px solid rgba(16,185,129,.35);
    background: rgba(16,185,129,.08); padding: 2px 8px; border-radius: 999px; letter-spacing: 1px;
  }
  .subtitle { margin-top: 6px; font-size: 13px; color: var(--muted); }

  /* ===== metric cards ===== */
  .metrics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-top: 22px;
  }
  .metric {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px;
  }
  .metric-value { font-size: 26px; font-weight: 700; color: var(--accent); }
  .metric-label { margin-top: 2px; font-size: 12px; color: var(--muted); }

  /* ===== sections ===== */
  section { margin-top: 38px; }
  h2 { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .sec-idx { font-size: 12px; color: var(--accent); }

  /* ===== board ===== */
  .board {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  .col-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .col-head .name { font-size: 13px; font-weight: 600; color: var(--text); }
  .count {
    font-size: 12px; color: var(--muted); background: var(--card);
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px;
  }
  .col-cards { display: flex; flex-direction: column; gap: 10px; }
  .empty { font-size: 12px; color: var(--faint); border: 1px dashed var(--border); border-radius: 10px; padding: 14px; text-align: center; }

  .emp-card {
    position: relative; background: var(--card); border: 1px solid var(--border);
    border-left: 3px solid var(--border); border-radius: 10px; padding: 12px 14px;
  }
  .emp-card.lv-warn { border-left-color: var(--warn); }
  .emp-card.lv-review { border-left-color: var(--err); }
  .card-top { display: flex; align-items: center; gap: 8px; }
  .card-top .emp { font-size: 14px; font-weight: 600; }
  .badge-force {
    margin-left: auto; font-size: 11px; font-family: var(--mono);
    color: var(--err); background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.35);
    border-radius: 999px; padding: 1px 8px; white-space: nowrap;
  }
  .mode-chip { font-size: 11px; font-family: var(--mono); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .mode-chip.online { color: var(--accent); background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); }
  .mode-chip.offline { color: var(--muted); background: rgba(113,113,122,.12); border: 1px solid var(--border); }
  .card-line { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .card-extra { padding-top: 8px; border-top: 1px dashed var(--border); }
  .card-top .badge-force + .mode-chip { margin-left: 0; }
  .card-top .emp + .mode-chip { margin-left: auto; }
  .card-top .emp + .badge-force { margin-left: auto; }

  /* ===== legend ===== */
  .legend {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
    margin-top: 16px; font-size: 12px; color: var(--muted);
  }
  .legend .sep { color: var(--faint); }
  .legend-note { color: var(--faint); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot-pass { background: var(--accent); }
  .dot-warn { background: var(--warn); }
  .dot-review { background: var(--err); }

  /* ===== diff panel ===== */
  .diff-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .diff-stat {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; display: flex; align-items: baseline; gap: 10px;
  }
  .ds-value { font-size: 22px; font-weight: 700; }
  .ds-label { font-size: 12px; color: var(--muted); }

  .c-pass { color: var(--accent); }
  .c-warn { color: var(--warn); }
  .c-review { color: var(--err); }
  .c-muted { color: var(--faint); }

  .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--card); }
  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  th, td { padding: 10px 14px; text-align: left; white-space: nowrap; }
  th {
    font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 1px;
    color: var(--muted); border-bottom: 1px solid var(--border); background: rgba(39,39,42,.4);
  }
  td { font-size: 13px; border-bottom: 1px solid rgba(39,39,42,.6); }
  tbody tr:last-child td { border-bottom: none; }
  th.num, td.num { text-align: right; }
  tbody tr.row-review td:first-child { box-shadow: inset 3px 0 0 var(--err); }

  .st-chip {
    display: inline-block; font-size: 11px; font-family: var(--mono);
    border-radius: 999px; padding: 1px 9px; white-space: nowrap;
  }
  .st-pass { color: var(--accent); background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); }
  .st-warn { color: var(--warn); background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); }
  .st-review { color: var(--err); background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.35); }
  .st-pending { color: var(--muted); background: rgba(113,113,122,.12); border: 1px solid var(--border); }

  /* ===== timeline ===== */
  .timeline { display: flex; flex-direction: column; }
  .tl-item { display: grid; grid-template-columns: 100px 28px 1fr; }
  .tl-time { display: flex; flex-direction: column; padding: 2px 0 22px; }
  .tl-day { font-size: 11px; color: var(--faint); }
  .tl-time .mono { font-size: 13px; color: var(--muted); }
  .tl-rail { position: relative; }
  .tl-rail::before {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    top: 0; bottom: 0; width: 2px; background: var(--border);
  }
  .tl-item:first-child .tl-rail::before { top: 10px; }
  .tl-item:last-child .tl-rail::before { bottom: calc(100% - 10px); }
  .tl-rail::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    top: 6px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 8px rgba(16,185,129,.6);
  }
  .tl-text { padding: 0 0 22px 6px; font-size: 13px; color: var(--text); }

  /* ===== footer ===== */
  footer {
    margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--faint); line-height: 1.7; text-align: center;
  }

  @media (max-width: 640px) {
    .wrap { padding: 20px 14px 40px; }
    .tl-item { grid-template-columns: 84px 22px 1fr; }
    .metric-value { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-row">
      <h1>假勤统计自动化工作流</h1>
      <span class="demo-chip mono">DEMO</span>
    </div>
    <p class="subtitle">HR 高并发流程治理 · 500+ 人规模 · 数据为脱敏示意</p>
  </header>

  <section class="metrics">
    <div class="metric">
      <div class="metric-value mono">500+</div>
      <div class="metric-label">覆盖员工人数</div>
    </div>
    <div class="metric">
      <div class="metric-value mono">2500+</div>
      <div class="metric-label">条记录 / 周期</div>
    </div>
    <div class="metric">
      <div class="metric-value mono">→ 0</div>
      <div class="metric-label">自动化流程错误率</div>
    </div>
  </section>

  <section>
    <h2><span class="sec-idx mono">01</span>状态看板</h2>
    <div class="board" id="board"></div>
    <div class="legend mono">
      <span><i class="dot dot-pass"></i>|差异率| &lt; 20% 通过</span>
      <span class="sep">·</span>
      <span><i class="dot dot-warn"></i>20%–50% 预警</span>
      <span class="sep">·</span>
      <span><i class="dot dot-review"></i>≥ 50% 强制复核</span>
      <span class="legend-note">（阈值由本人在流程设计中定义）</span>
    </div>
  </section>

  <section>
    <h2><span class="sec-idx mono">02</span>差异面板</h2>
    <div class="diff-stats">
      <div class="diff-stat"><span class="ds-value mono" id="stTotal">0</span><span class="ds-label">总记录数</span></div>
      <div class="diff-stat"><span class="ds-value mono c-warn" id="stWarn">0</span><span class="ds-label">预警数</span></div>
      <div class="diff-stat"><span class="ds-value mono c-review" id="stReview">0</span><span class="ds-label">强制复核数</span></div>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>员工</th>
            <th>部门</th>
            <th>日期</th>
            <th>线上·线下</th>
            <th class="num">预估时长</th>
            <th class="num">实报时长</th>
            <th class="num">差异率</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="diffBody"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2><span class="sec-idx mono">03</span>催办时间线</h2>
    <div class="timeline" id="timeline"></div>
  </section>

  <footer>
    本项目原运行于企业内部环境。此页面所有界面与数据均为脱敏后重绘的示意版本，不代表真实业务数据。
  </footer>

</div>

<script>
  // ===== 数据 =====
  const records = [
    { id: "R001", employee: "员工A", dept: "部门1", date: "2025-05-01", mode: "offline", estHours: 4, actualHours: 4,   diffRate: 0,    approver: "负责人A", status: "closed" },
    { id: "R002", employee: "员工B", dept: "部门1", date: "2025-05-01", mode: "online",  estHours: 3, actualHours: 3.5, diffRate: 0.17, approver: "负责人A", status: "closed" },
    { id: "R003", employee: "员工C", dept: "部门2", date: "2025-05-02", mode: "offline", estHours: 6, actualHours: 3,   diffRate: -0.5, approver: "负责人B", status: "exception" },
    { id: "R004", employee: "员工D", dept: "部门2", date: "2025-05-02", mode: "online",  estHours: 4, actualHours: 4.8, diffRate: 0.2,  approver: "负责人B", status: "exception" },
    { id: "R005", employee: "员工E", dept: "部门3", date: "2025-05-03", mode: "offline", estHours: 8, actualHours: 8,   diffRate: 0,    approver: "负责人C", status: "closed" },
    { id: "R006", employee: "员工F", dept: "部门1", date: "2025-05-03", mode: "online",  estHours: 2, actualHours: null, diffRate: null, approver: "负责人A", status: "post_pending" },
    { id: "R007", employee: "员工G", dept: "部门3", date: "2025-05-04", mode: "offline", estHours: 5, actualHours: 1.5, diffRate: -0.7, approver: "负责人C", status: "exception" },
    { id: "R008", employee: "员工H", dept: "部门2", date: "2025-05-04", mode: "online",  estHours: 4, actualHours: 4.2, diffRate: 0.05, approver: "负责人B", status: "closed" },
    { id: "R009", employee: "员工I", dept: "部门1", date: "2025-05-04", mode: "offline", estHours: 6, actualHours: null, diffRate: null, approver: "负责人A", status: "post_pending" },
    { id: "R010", employee: "员工J", dept: "部门3", date: "2025-05-05", mode: "online",  estHours: 3, actualHours: null, diffRate: null, approver: "负责人C", status: "pre_pending" },
    { id: "R011", employee: "员工K", dept: "部门2", date: "2025-05-05", mode: "offline", estHours: 7, actualHours: 7.5, diffRate: 0.07, approver: "负责人B", status: "closed" },
    { id: "R012", employee: "员工L", dept: "部门1", date: "2025-05-05", mode: "online",  estHours: 4, actualHours: null, diffRate: null, approver: "负责人A", status: "pre_pending" }
  ];

  // ===== 工具函数 =====
  const $ = id => document.getElementById(id);
  const modeText = m => m === "online" ? "线上" : "线下";

  function fmtPct(v) {
    if (v === null) return "—";
    if (v === 0) return "0.0%";
    return (v > 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
  }

  // 差异等级：pass(<20%) / warn(20%-50%) / review(>=50%) / pending(未日报)
  function levelOf(r) {
    if (r.diffRate === null) return "pending";
    const a = Math.abs(r.diffRate);
    if (a >= 0.5) return "review";
    if (a >= 0.2) return "warn";
    return "pass";
  }

  // ===== 区块 1：状态看板 =====
  const boardCols = [
    { key: "pre_pending",  title: "节前待审批" },
    { key: "post_pending", title: "节后待日报" },
    { key: "exception",    title: "异常预警池" }
  ];

  $("board").innerHTML = boardCols.map(col => {
    const list = records.filter(r => r.status === col.key);
    const cards = list.map(r => {
      const lvl = levelOf(r);
      const lvCls = lvl === "review" ? "lv-review" : lvl === "warn" ? "lv-warn" : "";
      const diffColor = lvl === "review" ? "c-review" : lvl === "warn" ? "c-warn" : "c-pass";
      const extra = r.status === "exception"
        ? `<div class="card-line mono card-extra">实报 ${r.actualHours}h · 差异率 <span class="${diffColor}">${fmtPct(r.diffRate)}</span></div>`
        : "";
      return `
        <div class="emp-card ${lvCls}">
          <div class="card-top">
            <span class="emp">${r.employee}</span>
            ${lvl === "review" ? '<span class="badge-force">强制复核</span>' : ""}
            <span class="mode-chip ${r.mode}">${modeText(r.mode)}</span>
          </div>
          <div class="card-line mono">${r.dept} · ${r.date}</div>
          <div class="card-line mono">预估 ${r.estHours}h · 审批 ${r.approver}</div>
          ${extra}
        </div>`;
    }).join("");
    return `
      <div class="board-col">
        <div class="col-head">
          <span class="name">${col.title}</span>
          <span class="count mono">${list.length}</span>
        </div>
        <div class="col-cards">${cards || '<div class="empty">暂无记录</div>'}</div>
      </div>`;
  }).join("");

  // ===== 区块 2：差异面板 =====
  const withDiff = records.filter(r => r.diffRate !== null);
  $("stTotal").textContent = records.length;
  $("stWarn").textContent = withDiff.filter(r => levelOf(r) === "warn").length;
  $("stReview").textContent = withDiff.filter(r => levelOf(r) === "review").length;

  const statusMap = {
    pass:    ["通过", "st-pass"],
    warn:    ["预警", "st-warn"],
    review:  ["强制复核", "st-review"],
    pending: ["待日报", "st-pending"]
  };

  $("diffBody").innerHTML = records.map(r => {
    const lvl = levelOf(r);
    const [stText, stCls] = statusMap[lvl];
    const diffCls = lvl === "pending" ? "c-muted" : "c-" + lvl;
    return `
      <tr class="${lvl === "review" ? "row-review" : ""}">
        <td>${r.employee}</td>
        <td>${r.dept}</td>
        <td class="mono">${r.date}</td>
        <td>${modeText(r.mode)}</td>
        <td class="mono num">${r.estHours}h</td>
        <td class="mono num">${r.actualHours === null ? "—" : r.actualHours + "h"}</td>
        <td class="mono num ${diffCls}">${fmtPct(r.diffRate)}</td>
        <td><span class="st-chip ${stCls}">${stText}</span></td>
      </tr>`;
  }).join("");

  // ===== 区块 3：催办时间线 =====
  const timelineEvents = [
    ["节后 D+1", "09:00", "向 32 位未提交日报员工发送提醒"],
    ["节后 D+2", "09:00", "向仍未提交的员工二次提醒，抄送其部门负责人"],
    ["节后 D+3", "09:00", "8 位超时未提交员工升级至负责人"],
    ["节后 D+4", "10:00", "生成异常数据清单，推送 HR 复核"],
    ["节后 D+5", "14:00", "HR 终审完成，导出薪酬核算表"]
  ];

  $("timeline").innerHTML = timelineEvents.map(([day, time, text]) => `
    <div class="tl-item">
      <div class="tl-time">
        <span class="tl-day">${day}</span>
        <span class="mono">${time}</span>
      </div>
      <div class="tl-rail"></div>
      <div class="tl-text">${text}</div>
    </div>`).join("");
</script>
</body>
</html>
